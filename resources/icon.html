<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1024px;
        height: 1024px;
        overflow: hidden;
      }
      body {
        background: radial-gradient(circle at 50% 45%, #3b2f8f 0%, #1a144a 55%, #0b0a24 100%);
        position: relative;
        font-family: sans-serif;
      }
      .star {
        position: absolute;
        background: #fff;
        border-radius: 50%;
      }
      .glow {
        position: absolute;
        left: 162px;
        top: 180px;
        width: 700px;
        height: 700px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(110, 200, 255, 0.55), rgba(110, 200, 255, 0) 70%);
      }
      .planet {
        position: absolute;
        left: 262px;
        top: 280px;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: conic-gradient(#2f7fe0 0 22%, #2f9e4f 22% 45%, #8fd65a 45% 58%, #e6c170 58% 70%, #d9533b 70% 78%, #1fc6c0 78% 100%);
        box-shadow:
          inset -60px -70px 90px rgba(0, 0, 30, 0.55),
          inset 40px 50px 80px rgba(255, 255, 255, 0.25);
      }
      .core {
        position: absolute;
        left: 377px;
        top: 395px;
        width: 270px;
        height: 270px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #8a7596, #4a3b5c);
        box-shadow: inset -30px -30px 60px rgba(0, 0, 30, 0.4);
      }
      .e {
        position: absolute;
        font-size: 150px;
        line-height: 1;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="planet"></div>
    <div class="core"></div>
    <div class="e" style="left: 512px; top: 235px; font-size: 170px">🦊</div>
    <div class="e" style="left: 245px; top: 420px; transform: translate(-50%, -50%) rotate(-60deg)">🌲</div>
    <div class="e" style="left: 800px; top: 470px; transform: translate(-50%, -50%) rotate(70deg)">🐢</div>
    <div class="e" style="left: 330px; top: 760px; transform: translate(-50%, -50%) rotate(-140deg)">🌋</div>
    <div class="e" style="left: 760px; top: 770px; transform: translate(-50%, -50%) rotate(140deg)">🐙</div>
    <div class="e" style="left: 860px; top: 180px; font-size: 120px; transform: translate(-50%, -50%) rotate(-30deg)">☄️</div>
    <script>
      for (let i = 0; i < 70; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const r = Math.random() * 5 + 2;
        s.style.cssText = `left:${Math.random() * 1024}px;top:${Math.random() * 1024}px;width:${r}px;height:${r}px;opacity:${Math.random() * 0.7 + 0.3}`;
        document.body.prepend(s);
      }
    </script>
  </body>
</html>
