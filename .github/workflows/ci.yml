name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Compiles the native iOS app (Capacitor + Swift packages + the Game Center plugin)
  # for the Simulator. No signing, so it needs no Apple account.
  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for iOS Simulator
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 80
          exit ${PIPESTATUS[0]}
      # Zipped Simulator build: download it from the run's Artifacts section and
      # install with `xcrun simctl install booted App.app` (see README).
      - name: Package Simulator app
        run: ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/App.app PocketPlanet-Simulator.zip
      - uses: actions/upload-artifact@v5
        with:
          name: PocketPlanet-Simulator
          path: PocketPlanet-Simulator.zip
          retention-days: 30
