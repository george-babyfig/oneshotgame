name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Reject dev tools in production bundle
        run: '! grep -rqE "Balance Report|__app|__i18n|__scene|__gate" dist/'

  # M8 quick difficulty and two-sided lint gates on planets 1-60.
  # The full shadow-seed curve and 61-120 watches run nightly.
  sim-quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sim:quick

  # Stable M8 curve and two-sided lint gates; runs beside the e2e matrix.
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: SIM=1 SIM_BALANCE=1 TROUBLE_RUNS=32 npx vitest run tests/sim/balance.sim.ts tests/sim/trouble-cost.sim.ts

  # Playwright journeys (J1-J7, prices, gate, overlap, showtime) — one job per browser
  # project so the three run in parallel and each stays well inside its time limit.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-320x568, chromium-390x844, webkit-390x844]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ startsWith(matrix.project, 'webkit') && 'webkit' || 'chromium' }}
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: e2e-results-${{ matrix.project }}
          path: test-results/
          retention-days: 14

  # Compiles the native iOS app (Capacitor + Swift packages + the Game Center plugin)
  # for the Simulator. No signing, so it needs no Apple account.
  ios-build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Build for iOS Simulator
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 80
          exit ${PIPESTATUS[0]}
      # Zipped Simulator build: download it from the run's Artifacts section and
      # install with `xcrun simctl install booted App.app` (see README).
      - name: Package Simulator app
        run: ditto -c -k --keepParent build/Build/Products/Debug-iphonesimulator/App.app PocketPlanet-Simulator.zip
      - uses: actions/upload-artifact@v5
        with:
          name: PocketPlanet-Simulator
          path: PocketPlanet-Simulator.zip
          retention-days: 30
