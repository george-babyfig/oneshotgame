name: Nightly sims

# Reviewed curve, dedicated shadow generator gate, 90-day Daily and 12-week Voyage pre-flight.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sims:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reviewed M8 curve and two-sided lint (61-120 watches)
        run: SIM_NIGHTLY=1 npm run sim
      - if: always()
        run: SIM=1 SIM_NIGHTLY=1 npx vitest run tests/sim/flying-nightly.sim.ts --disableConsoleIntercept
      - name: Calendar pre-flight (90 Daily Planets, 12 Voyage weeks)
        if: always()
        run: SIM=1 SIM_NIGHTLY=1 npx vitest run tests/sim/calendar-preflight.sim.ts --disableConsoleIntercept

  shadow-curve:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sim:shadow

  economy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: SIM_NIGHTLY=1 npm run sim:economy

  loadout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: SIM_NIGHTLY=1 npm run sim:loadout
