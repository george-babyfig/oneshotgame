name: Nightly sims

# Reviewed curve, dedicated shadow generator gate, 120-day Daily and 104-week Voyage pre-flight.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  sims:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reviewed M8 curve and two-sided lint (61-120 watches)
        run: SIM_NIGHTLY=1 npm run sim
      - if: always()
        run: SIM=1 SIM_NIGHTLY=1 npx vitest run tests/sim/flying-nightly.sim.ts --disableConsoleIntercept
      - name: Calendar pre-flight (120 Daily Planets, 104 Voyage weeks)
        if: always()
        run: SIM=1 SIM_NIGHTLY=1 npx vitest run tests/sim/calendar-preflight.sim.ts --disableConsoleIntercept

  shadow-curve:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sim:shadow

  economy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: SIM_NIGHTLY=1 npm run sim:economy:all

  # M11.5 release layout: six shipped languages at four sizes in both engines.
  homeworld-life:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        viewport: [320x568, 375x667, 390x844, 430x932]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: J5 and J2 Homeworld Life qualification
        env:
          M115_VIEWPORT: ${{ matrix.viewport }}
          LOCALE: en,es,fr,de,pt,ja
        run: npx playwright test e2e/j5.spec.ts e2e/j2.spec.ts -g 'M11.5' --project=${{ matrix.browser }}-320x568
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: homeworld-life-${{ matrix.browser }}-${{ matrix.viewport }}
          path: test-results/
          retention-days: 14

  loadout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: SIM_NIGHTLY=1 npm run sim:loadout
