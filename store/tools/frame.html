<!doctype html>
<!--
  Comet Garden App Store frame: one caption band on top, the raw 440×956@3x game frame in a rounded phone
  below it, on a soft gradient of the scene colour. Rendered at exactly 1320×2868 by store/tools/shots.mjs
  (it calls window.render({...}) and screenshots the page). Fonts load from node_modules only, never the network.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>Comet Garden store frame</title>
    <style>
      @font-face {
        font-family: 'Fredoka';
        font-weight: 700;
        src: url('../../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2') format('woff2');
        unicode-range:
          U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
          U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Fredoka';
        font-weight: 700;
        src: url('../../node_modules/@fontsource/fredoka/files/fredoka-latin-ext-700-normal.woff2') format('woff2');
        unicode-range:
          U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF,
          U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      :root {
        --w: 1320px;
        --h: 2868px;
        --bg: #ff9a3d;
        --ink: #1b1846;
        /* phone: outer width, bezel, bottom margin (the caption band is what is left above it) */
        --phone-w: 1140px;
        --bezel: 20px;
        --screen-radius: 88px;
        --phone-bottom: 52px;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: var(--w);
        height: var(--h);
        overflow: hidden;
        background: var(--bg);
      }
      .stage {
        position: relative;
        width: var(--w);
        height: var(--h);
        overflow: hidden;
        /* soft light from the top, the scene colour below */
        background:
          radial-gradient(120% 60% at 50% 0%, color-mix(in srgb, var(--bg) 62%, white) 0%, transparent 70%),
          radial-gradient(90% 55% at 50% 72%, color-mix(in srgb, var(--bg) 88%, white) 0%, transparent 75%),
          linear-gradient(180deg, color-mix(in srgb, var(--bg) 80%, white) 0%, var(--bg) 38%, color-mix(in srgb, var(--bg) 88%, black) 100%);
      }
      /* a few big soft dots, the same on every shot */
      .stage::before,
      .stage::after {
        content: '';
        position: absolute;
        z-index: 0;
        border-radius: 50%;
        background: color-mix(in srgb, white 16%, transparent);
      }
      .stage::before {
        width: 520px;
        height: 520px;
        left: -210px;
        top: 1160px;
      }
      .stage::after {
        width: 380px;
        height: 380px;
        right: -150px;
        top: 520px;
      }
      .caption {
        position: absolute;
        z-index: 1;
        left: 70px;
        right: 70px;
        top: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .caption h1 {
        font-family: 'Fredoka', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', sans-serif;
        font-weight: 700;
        color: var(--ink);
        line-height: 1.08;
        letter-spacing: -0.5px;
        text-wrap: balance;
        overflow-wrap: normal;
        word-break: normal;
      }
      :lang(ja) .caption h1 {
        font-family: 'Fredoka', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', sans-serif;
        letter-spacing: 1px;
        line-height: 1.2;
        word-break: keep-all;
        -webkit-text-stroke: 1.6px var(--ink);
      }
      .phone {
        position: absolute;
        z-index: 2;
        left: 50%;
        transform: translateX(-50%);
        bottom: var(--phone-bottom);
        width: var(--phone-w);
        padding: var(--bezel);
        border-radius: calc(var(--screen-radius) + var(--bezel));
        background: linear-gradient(160deg, #2a2657 0%, #14122c 55%, #0d0b1f 100%);
        box-shadow:
          0 50px 110px rgba(18, 10, 58, 0.34),
          0 18px 40px rgba(18, 10, 58, 0.24),
          inset 0 0 0 3px rgba(255, 255, 255, 0.08);
      }
      .screen {
        display: block;
        width: 100%;
        aspect-ratio: 440 / 956;
        border-radius: var(--screen-radius);
        overflow: hidden;
        background: #0b0a1e;
      }
      .screen img {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="caption"><h1 id="caption"></h1></div>
      <div class="phone">
        <div class="screen"><img id="shot" alt="" /></div>
      </div>
    </div>
    <script>
      /** Lines of text in an element (by its client rects' distinct tops). */
      function lineCount(el) {
        const range = document.createRange();
        range.selectNodeContents(el);
        const tops = new Set([...range.getClientRects()].map((r) => Math.round(r.top)));
        return tops.size;
      }
      /**
       * Where a Japanese caption reads best in two lines: after 、。 or the particles を/が/で (の, と, に, は are
       * left out because they often end a word, as in こまりごと or いきもの), the most balanced one.
       */
      function jaBreak(text) {
        const chars = [...text];
        const cut = [];
        chars.forEach((c, i) => {
          if (i < 3 || i > chars.length - 4) return;
          if ('、。'.includes(c)) cut.push({ at: i + 1, bonus: 3 });
          else if ('がでを'.includes(c) && !'、。'.includes(chars[i + 1])) cut.push({ at: i + 1, bonus: 0 });
        });
        if (!cut.length) return text;
        const half = chars.length / 2;
        cut.sort((a, b) => Math.abs(a.at - half) - a.bonus - (Math.abs(b.at - half) - b.bonus));
        const at = cut[0].at;
        return chars.slice(0, at).join('') + '\n' + chars.slice(at).join('');
      }
      window.render = async ({ caption, bg, ink, img, lang, maxPx = 108, minPx = 72 }) => {
        document.documentElement.lang = lang;
        document.documentElement.style.setProperty('--bg', bg);
        document.documentElement.style.setProperty('--ink', ink);
        const h1 = document.getElementById('caption');
        const band = h1.parentElement;
        const phone = document.querySelector('.phone');
        const shot = document.getElementById('shot');
        await new Promise((resolve, reject) => {
          shot.onload = resolve;
          shot.onerror = () => reject(new Error('raw frame did not load: ' + img));
          shot.src = img;
        });
        await document.fonts.load('700 100px Fredoka');
        await document.fonts.ready;
        // the caption band is everything above the phone, with a little air
        const top = 64;
        const bottomGap = 44;
        const phoneTop = phone.getBoundingClientRect().top;
        band.style.top = top + 'px';
        band.style.height = phoneTop - top - bottomGap + 'px';
        const text = lang === 'ja' ? jaBreak(caption) : caption;
        h1.innerHTML = '';
        text.split('\n').forEach((line, i) => {
          if (i) h1.append(document.createElement('br'));
          h1.append(document.createTextNode(line));
        });
        let px = maxPx;
        for (; px >= minPx; px -= 2) {
          h1.style.fontSize = px + 'px';
          const fits =
            lineCount(h1) <= 2 && h1.scrollWidth <= band.clientWidth + 1 && h1.getBoundingClientRect().height <= band.clientHeight;
          if (fits) break;
        }
        return {
          px,
          lines: lineCount(h1),
          band: { top, height: band.clientHeight },
          phone: phone.getBoundingClientRect().toJSON(),
          fredoka: document.fonts.check('700 100px Fredoka'),
        };
      };
    </script>
  </body>
</html>
